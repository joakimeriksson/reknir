services:
  postgres:
    image: postgres:16-alpine
    container_name: reknir-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reknir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reknir}
      POSTGRES_DB: ${POSTGRES_DB:-reknir}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    # No port exposure - internal only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reknir}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - reknir-internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: reknir-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reknir}:${POSTGRES_PASSWORD:-reknir}@postgres:5432/${POSTGRES_DB:-reknir}
      CORS_ORIGINS: ${CORS_ORIGINS:-${APP_URL:-*}}
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
    # No port exposure - accessed via nginx only
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/backups
    restart: unless-stopped
    networks:
      - reknir-internal
    # Production mode - no reload, migrations run in Dockerfile.prod CMD

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: reknir-frontend
    # No port exposure - accessed via nginx gateway only
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - reknir-internal
    # Dockerfile.prod serves built static files via nginx

  # Gateway - the stack's single entry point: routes / to the frontend and
  # /api to the backend. The only published port (NGINX_PORT).
  nginx:
    image: nginx:alpine
    container_name: reknir-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - reknir-internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3


  # Cloudflare Tunnel - secure access without exposing ports.
  # Opt-in: started only with COMPOSE_PROFILES=tunnel (set TUNNEL_TOKEN in .env).
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: reknir-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - reknir-internal

volumes:
  postgres_data:
    driver: local

networks:
  reknir-internal:
    driver: bridge
